<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>کافه سه‌بعدی | پنل مدیریت و چیدمان</title>
    
    <!-- نمایشگر سه‌بعدی تعاملی برای پاپ‌آپ محصولات -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <!-- نقشه ایمپورت برای Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { overflow: hidden; background: #111; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* صفحه لودینگ */
        #loader-screen {
            position: fixed; inset: 0; background: #18181b; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 45px; height: 45px; border: 4px solid #333; border-top-color: #fbbf24;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* هدر بالای صفحه */
        #top-bar {
            position: fixed; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            z-index: 100; pointer-events: none; flex-wrap: wrap;
        }
        .btn-group { display: flex; gap: 8px; pointer-events: auto; }
        .badge-info {
            background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(8px);
            padding: 9px 14px; border-radius: 12px; border: 1px solid #3f3f46;
            font-size: 12px; pointer-events: auto;
        }
        #cart-btn {
            background: #fbbf24; color: #000; border: none; padding: 9px 14px;
            border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }
        #admin-toggle-btn {
            background: #2563eb; color: #fff; border: none; padding: 9px 14px;
            border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        /* پنل تنظیمات مدیر (چیدمان زنده) */
        #admin-panel {
            display: none; position: fixed; bottom: 12px; left: 12px; right: 12px;
            max-width: 420px; margin: 0 auto;
            background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(12px);
            border: 1px solid #3f3f46; border-radius: 16px; padding: 14px;
            z-index: 500; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            max-height: 48vh; overflow-y: auto;
        }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px;
        }
        .control-group { margin-bottom: 8px; }
        .control-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-bottom: 6px; font-size: 12px;
        }
        .control-row label { width: 75px; color: #d4d4d8; }
        .control-row input[type=range] { flex: 1; accent-color: #fbbf24; }
        .control-row span { width: 45px; text-align: left; color: #fbbf24; font-family: monospace; }
        select {
            width: 100%; padding: 8px; border-radius: 8px; background: #27272a;
            color: #fff; border: 1px solid #52525b; font-size: 13px; margin-bottom: 10px;
        }
        .admin-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-save { flex: 1; background: #16a34a; color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-copy { flex: 1; background: #9333ea; color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-reset { background: #dc2626; color: #fff; border: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }

        /* پاپ‌آپ عمومی */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            z-index: 1000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-box {
            background: #18181b; border: 1px solid #3f3f46; border-radius: 18px;
            width: 360px; max-width: 100%; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: popIn 0.25s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #27272a; padding-bottom: 12px; margin-bottom: 12px;
        }
        .close-btn { background: none; border: none; color: #ef4444; font-size: 20px; cursor: pointer; }

        model-viewer {
            width: 100%; height: 210px; background: #27272a; border-radius: 12px; margin-bottom: 8px;
        }
        .items-list {
            display: flex; flex-direction: column; gap: 8px; max-height: 210px; overflow-y: auto; margin-top: 10px;
        }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #27272a; padding: 10px 12px; border-radius: 10px;
        }
        .add-btn {
            background: #16a34a; color: #fff; border: none; padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="spinner"></div>
        <div style="font-size: 14px; color: #e4e4e7;">در حال تراز کردن مدل‌ها و آماده‌سازی کافه...</div>
    </div>

    <!-- نوار بالا -->
    <div id="top-bar">
        <div class="btn-group">
            <button id="cart-btn" onclick="openCartModal()">🛒 سبد (<span id="cart-count">0</span>)</button>
            <button id="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ پنل چیدمان مدیر</button>
        </div>
        <div class="badge-info">☕ روی محصولات کلیک کنید</div>
    </div>

    <!-- پنل چیدمان زنده مدیر -->
    <div id="admin-panel">
        <div class="admin-header">
            <span style="font-weight:bold; color:#fbbf24; font-size:13px;">🎛️ تنظیم زنده اشیاء در صحنه</span>
            <button onclick="toggleAdminPanel()" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer;">✖</button>
        </div>
        
        <select id="target-object-select" onchange="loadObjectToSliders()">
            <option value="counter">۱. کانتر و ویترین (Tim Hortons)</option>
            <option value="breakfast_pack">۲. پک تست‌های صبحانه</option>
            <option value="golden_waffles">۳. بشقاب وافل طلایی</option>
            <option value="pancake_pack">۴. پک پنکیک‌های ویژه</option>
            <option value="cafe">۵. ساختمان کافه (غرفه)</option>
        </select>

        <div class="control-group">
            <div class="control-row">
                <label>چپ / راست (X):</label>
                <input type="range" id="pos-x" min="-4" max="4" step="0.05" oninput="updateTransform()">
                <span id="val-x">0</span>
            </div>
            <div class="control-row">
                <label>ارتفاع (Y):</label>
                <input type="range" id="pos-y" min="-1" max="3" step="0.05" oninput="updateTransform()">
                <span id="val-y">0</span>
            </div>
            <div class="control-row">
                <label>عقب / جلو (Z):</label>
                <input type="range" id="pos-z" min="-4" max="4" step="0.05" oninput="updateTransform()">
                <span id="val-z">0</span>
            </div>
            <div class="control-row">
                <label>چرخش (Y):</label>
                <input type="range" id="rot-y" min="-3.14" max="3.14" step="0.05" oninput="updateTransform()">
                <span id="val-rot">0</span>
            </div>
            <div class="control-row">
                <label>بزرگ‌نمایی:</label>
                <input type="range" id="scale-all" min="0.1" max="4" step="0.05" oninput="updateTransform()">
                <span id="val-scale">1</span>
            </div>
        </div>

        <div class="admin-actions">
            <button class="btn-save" onclick="saveLayoutToBrowser()">💾 ذخیره در مرورگر</button>
            <button class="btn-copy" onclick="copyLayoutConfig()">📋 کپی کد مختصات</button>
            <button class="btn-reset" onclick="resetLayout()">بازنشانی</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- پاپ‌آپ پیش‌نمایش ۳۶۰ درجه و سفارش محصول -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size: 16px; color: #fbbf24;">محصول</h3>
                <button class="close-btn" onclick="closeProductModal()">✖</button>
            </div>
            <model-viewer id="viewer-3d" src="" auto-rotate camera-controls shadow-intensity="1"></model-viewer>
            <div style="text-align: center; font-size: 11px; color: #a1a1aa;">👆 محصول را با انگشت یا موس بچرخانید</div>
            <div id="modal-items" class="items-list"></div>
        </div>
    </div>

    <!-- پاپ‌آپ سبد خرید -->
    <div id="cart-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="font-size: 16px; color: #fbbf24;">🛒 سبد سفارش شما</h3>
                <button class="close-btn" onclick="closeCartModal()">✖</button>
            </div>
            <div id="cart-items-container" class="items-list"></div>
            <div style="border-top: 1px solid #27272a; margin-top: 12px; padding-top: 12px; display: flex; justify-content: space-between; font-weight: bold;">
                <span>جمع کل:</span>
                <span id="cart-total" style="color: #4ade80;">0 تومان</span>
            </div>
            <button onclick="submitOrder()" style="width: 100%; background: #fbbf24; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 12px; cursor: pointer;">ثبت نهایی سفارش</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x18181b);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.1, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        // نورپردازی
        scene.add(new THREE.AmbientLight(0xffffff, 1.7));
        const dirLight = new THREE.DirectionalLight(0xfff5e4, 2.2);
        dirLight.position.set(4, 8, 5);
        scene.add(dirLight);

        const BASE_URL = "https://raw.githubusercontent.com/Sirens-cmyk/model3d/main/";

        const productsCatalog = {
            breakfast_pack: {
                title: "پک تست‌های صبحانه (۶ مدل)",
                modelUrl: BASE_URL + "breakfast_toast_pack_3d_model.glb",
                items: [
                    { name: "تست آووکادو ویژه", price: 145000 },
                    { name: "تست عسل طبیعی", price: 95000 },
                    { name: "تست قارچ و پنیر خامه‌ای", price: 135000 },
                    { name: "تست نوتلا و موز", price: 125000 },
                    { name: "تست کره محلی", price: 85000 },
                    { name: "تست نیمرو کلاسیک", price: 110000 }
                ]
            },
            golden_waffles: {
                title: "وافل طلایی با کره و شیره افرا",
                modelUrl: BASE_URL + "golden_waffles_with_butter_and_maple_syrup.glb",
                items: [
                    { name: "وافل کلاسیک کره و شیره افرا", price: 165000 }
                ]
            },
            pancake_pack: {
                title: "پک پنکیک‌های ویژه (۶ مدل)",
                modelUrl: BASE_URL + "cute_pancake_stacks_3d_model.glb",
                items: [
                    { name: "پنکیک کلاسیک کره و شیره", price: 130000 },
                    { name: "پنکیک شکلاتی با خامه", price: 145000 },
                    { name: "پنکیک کارامل و موز", price: 140000 },
                    { name: "پنکیک بلوبری جنگلی", price: 155000 },
                    { name: "پنکیک توت‌فرنگی و تمشک", price: 160000 },
                    { name: "پنکیک ماچا و خامه", price: 150000 }
                ]
            }
        };

        // مختصات پیش‌فرض نرمال‌شده (پس از تراز خودکار ابعاد مدل‌ها)
        const defaultLayout = {
            cafe:           { x: 0,     y: 0,    z: 0,     rotY: 0, scale: 1.0 },
            counter:        { x: 0,     y: 0.05, z: -0.4,  rotY: 0, scale: 1.0 },
            breakfast_pack: { x: -0.35, y: 1.05, z: -0.35, rotY: 0, scale: 1.0 },
            golden_waffles: { x: 0.35,  y: 1.05, z: -0.35, rotY: 0, scale: 1.0 },
            pancake_pack:   { x: 0.0,   y: 1.30, z: -0.35, rotY: 0, scale: 1.0 }
        };

        // بارگذاری تنظیمات ذخیره‌شده مدیر (در صورت وجود)
        const savedLayout = JSON.parse(localStorage.getItem('cafe_3d_layout_v1')) || defaultLayout;
        const sceneObjects = {};
        const clickableMeshes = [];

        // تابع نرمال‌سازی خودکار ابعاد و مرکز مدل (حل مشکل کوچک بودن کانتر و پرت شدن مدل‌ها)
        function normalizeModel(rawModel, targetMaxDimension, alignBottomToZero = true) {
            const wrapper = new THREE.Group();
            const box = new THREE.Box3().setFromObject(rawModel);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const autoScale = targetMaxDimension / maxDim;

            rawModel.scale.setScalar(autoScale);
            rawModel.position.x = -center.x * autoScale;
            rawModel.position.z = -center.z * autoScale;
            if (alignBottomToZero) {
                rawModel.position.y = -box.min.y * autoScale;
            } else {
                rawModel.position.y = -center.y * autoScale;
            }

            wrapper.add(rawModel);
            return wrapper;
        }

        function applyLayoutToObject(key, obj) {
            const cfg = savedLayout[key] || defaultLayout[key];
            obj.position.set(cfg.x, cfg.y, cfg.z);
            obj.rotation.y = cfg.rotY;
            obj.scale.setScalar(cfg.scale);
        }

        const loadingManager = new THREE.LoadingManager(() => {
            const loaderScreen = document.getElementById('loader-screen');
            loaderScreen.style.opacity = '0';
            setTimeout(() => loaderScreen.style.display = 'none', 500);
            if (window.loadObjectToSliders) window.loadObjectToSliders();
        });
        const loader = new GLTFLoader(loadingManager);

        // ۱. لود و تراز ساختمان کافه (عرض ۶ متر)
        loader.load(BASE_URL + "stan_6x4_gubukws.glb", (gltf) => {
            const cafeGroup = normalizeModel(gltf.scene, 6.0, true);
            sceneObjects['cafe'] = cafeGroup;
            applyLayoutToObject('cafe', cafeGroup);
            scene.add(cafeGroup);
        });

        // ۲. لود و تراز کانتر تیم هورتونز (عرض ۳.۸ متر تا قشنگ داخل کافه و در دید کامل باشد)
        loader.load(BASE_URL + "tim_hortons_counter.glb", (gltf) => {
            const counterGroup = normalizeModel(gltf.scene, 3.8, true);
            sceneObjects['counter'] = counterGroup;
            applyLayoutToObject('counter', counterGroup);
            scene.add(counterGroup);
        });

        // ۳. لود و تراز محصولات داخل ویترین
        function loadShowcaseItem(key, targetSize) {
            const data = productsCatalog[key];
            loader.load(data.modelUrl, (gltf) => {
                const itemGroup = normalizeModel(gltf.scene, targetSize, true);
                sceneObjects[key] = itemGroup;
                applyLayoutToObject(key, itemGroup);

                itemGroup.traverse((child) => {
                    if (child.isMesh) {
                        child.userData.productKey = key;
                        clickableMeshes.push(child);
                    }
                });
                scene.add(itemGroup);
            });
        }

        loadShowcaseItem('breakfast_pack', 0.45);
        loadShowcaseItem('golden_waffles', 0.32);
        loadShowcaseItem('pancake_pack',   0.45);

        // سیستم تشخیص کلیک روی محصولات
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
            if (dist > 6) return;

            if (document.getElementById('product-modal').style.display === 'flex' ||
                document.getElementById('cart-modal').style.display === 'flex') return;

            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(clickableMeshes);
            if (hits.length > 0) {
                window.openProductModal(hits[0].object.userData.productKey);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // اتصال متغیرها برای پنل مدیر
        window.catalog = productsCatalog;
        window.sceneObjects = sceneObjects;
        window.currentLayout = savedLayout;
        window.defaultLayout = defaultLayout;
    </script>

    <!-- منطق پنل چیدمان مدیر و سبد خرید -->
    <script>
        let cart = [];

        window.toggleAdminPanel = function() {
            const panel = document.getElementById('admin-panel');
            const isHidden = panel.style.display === 'none' || panel.style.display === '';
            panel.style.display = isHidden ? 'block' : 'none';
            if (isHidden) loadObjectToSliders();
        };

        window.loadObjectToSliders = function() {
            const key = document.getElementById('target-object-select').value;
            const cfg = window.currentLayout[key];
            if (!cfg) return;

            document.getElementById('pos-x').value = cfg.x;
            document.getElementById('pos-y').value = cfg.y;
            document.getElementById('pos-z').value = cfg.z;
            document.getElementById('rot-y').value = cfg.rotY;
            document.getElementById('scale-all').value = cfg.scale;

            updateLabels(cfg);
        };

        function updateLabels(cfg) {
            document.getElementById('val-x').innerText = Number(cfg.x).toFixed(2);
            document.getElementById('val-y').innerText = Number(cfg.y).toFixed(2);
            document.getElementById('val-z').innerText = Number(cfg.z).toFixed(2);
            document.getElementById('val-rot').innerText = Number(cfg.rotY).toFixed(2);
            document.getElementById('val-scale').innerText = Number(cfg.scale).toFixed(2);
        }

        window.updateTransform = function() {
            const key = document.getElementById('target-object-select').value;
            const obj = window.sceneObjects[key];
            if (!obj) return;

            const cfg = {
                x: parseFloat(document.getElementById('pos-x').value),
                y: parseFloat(document.getElementById('pos-y').value),
                z: parseFloat(document.getElementById('pos-z').value),
                rotY: parseFloat(document.getElementById('rot-y').value),
                scale: parseFloat(document.getElementById('scale-all').value)
            };

            window.currentLayout[key] = cfg;
            obj.position.set(cfg.x, cfg.y, cfg.z);
            obj.rotation.y = cfg.rotY;
            obj.scale.setScalar(cfg.scale);
            updateLabels(cfg);
        };

        window.saveLayoutToBrowser = function() {
            localStorage.setItem('cafe_3d_layout_v1', JSON.stringify(window.currentLayout));
            alert('✅ چیدمان جدید در مرورگر ذخیره شد!');
        };

        window.copyLayoutConfig = function() {
            const jsonText = JSON.stringify(window.currentLayout, null, 2);
            navigator.clipboard.writeText(jsonText).then(() => {
                alert('📋 کد مختصات کپی شد! می‌توانید برای ثبت دائمی آن را بفرستید.');
            });
        };

        window.resetLayout = function() {
            localStorage.removeItem('cafe_3d_layout_v1');
            location.reload();
        };

        window.openProductModal = function(key) {
            const product = window.catalog[key];
            if (!product) return;

            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('viewer-3d').setAttribute('src', product.modelUrl);

            const list = document.getElementById('modal-items');
            list.innerHTML = '';

            product.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div>
                        <div style="font-size:13px; font-weight:bold;">${item.name}</div>
                        <div style="font-size:12px; color:#fbbf24;">${item.price.toLocaleString()} تومان</div>
                    </div>
                    <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ افزودن</button>
                `;
                list.appendChild(row);
            });

            document.getElementById('product-modal').style.display = 'flex';
        };

        window.closeProductModal = function() {
            document.getElementById('product-modal').style.display = 'none';
            document.getElementById('viewer-3d').setAttribute('src', '');
        };

        window.addToCart = function(name, price) {
            cart.push({ name, price });
            document.getElementById('cart-count').innerText = cart.length;
            alert(`✅ "${name}" به سبد اضافه شد!`);
        };

        window.openCartModal = function() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#a1a1aa; padding:20px;">سبد خرید خالی است</div>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <div>
                            <div style="font-size:13px;">${item.name}</div>
                            <div style="font-size:11px; color:#fbbf24;">${item.price.toLocaleString()} تومان</div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ef4444; cursor:pointer;">حذف</button>
                    `;
                    container.appendChild(row);
                });
            }

            document.getElementById('cart-total').innerText = total.toLocaleString() + ' تومان';
            document.getElementById('cart-modal').style.display = 'flex';
        };

        window.closeCartModal = function() {
            document.getElementById('cart-modal').style.display = 'none';
        };

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            openCartModal();
        };

        window.submitOrder = function() {
            if (cart.length === 0) return alert('سبد خرید خالی است!');
            alert('🎉 سفارش شما با موفقیت ثبت شد!');
            cart = [];
            document.getElementById('cart-count').innerText = '0';
            closeCartModal();
        };
    </script>
</body>
</html>
